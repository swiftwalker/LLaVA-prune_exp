version: 1
label: "scheduler-smallscale-all-strategies-all-datasets"
pool_size: 6

gpu:
  min_free_gib: 16
  selection: "max_free"
  sample_seconds: 1
  poll_interval_seconds: 5

retry:
  budget_ratio: 0.2
  rounding: "ceil"

tmux:
  session_name: "sched_smallscale_all"
  log_dir: "entropy_exp/outputs/logs/tmux"

environment:
  conda_sh: "/data/liuyu/anaconda3/etc/profile.d/conda.sh"
  conda_env: "llava"

defaults:
  max_samples: 5
  extra_sets:
    - "inference.seed=42"
    - "pruning.layer_selection=fixed"

experiments:
  - name: "gqa_l1_r0.2_smallscale"
    dataset: "gqa"
    strategies:
      - "baseline"
      - "attn_score"
      - "pre_attn_score"
      - "masking_attn_score"
      - "entropy"
      - "random"
      - "sparsevlm"
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"

  - name: "mme_l1_r0.2_smallscale"
    dataset: "mme"
    strategies:
      - "baseline"
      - "attn_score"
      - "pre_attn_score"
      - "masking_attn_score"
      - "entropy"
      - "random"
      - "sparsevlm"
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"

  - name: "pope_l1_r0.2_smallscale"
    dataset: "pope"
    strategies:
      - "baseline"
      - "attn_score"
      - "pre_attn_score"
      - "masking_attn_score"
      - "entropy"
      - "random"
      - "sparsevlm"
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"
