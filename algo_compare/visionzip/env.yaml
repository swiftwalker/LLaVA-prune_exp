name: visionzip-official
description: "Environment notes for running official VisionZip wrappers."
python:
  preferred: "/home/liuyu/miniconda3/envs/llava/bin/python"
  fallback: "python3"
paths:
  default_model_path: "entropy_exp/models/llava-v1.5-7b"
outputs:
  base_dir: "algo_compare/visionzip/outputs"
datasets:
  gqa:
    question_file: "entropy_exp/eval_questions/gqa/llava_gqa_testdev_balanced.jsonl"
    image_folder: "entropy_exp/datasets/gqa/images"
    supports_local_eval: true
  mme:
    question_file: "entropy_exp/eval_questions/MME/llava_mme.jsonl"
    image_folder: "entropy_exp/datasets/MME_Benchmark_release_version"
    supports_local_eval: true
  pope:
    question_file: "entropy_exp/eval_questions/pope/llava_pope_test.jsonl"
    image_folder: "entropy_exp/datasets/pope/val2014"
    supports_local_eval: true
  textvqa:
    question_file: "entropy_exp/eval_questions/textvqa/llava_textvqa_val_v051_ocr.jsonl"
    image_folder: "entropy_exp/datasets/textvqa/train_images"
    supports_local_eval: true
  scienceqa:
    question_file: "entropy_exp/eval_questions/scienceqa/llava_test_CQM-A.json"
    image_folder: "entropy_exp/eval_questions/scienceqa/test"
    supports_local_eval: true
    notes: "The wrapper supports JSON-array ScienceQA and no-image samples."
  mmbench:
    question_file: "entropy_exp/eval_questions/mmbench/mmbench_dev_20230712.tsv"
    image_folder: null
    supports_local_eval: true
    max_new_tokens: 32
  mmvet:
    question_file: "entropy_exp/datasets/_prepared_new_vqa/mmvet/llava_mmvet_test.jsonl"
    image_folder: "entropy_exp/datasets/_prepared_new_vqa/mmvet/images"
    supports_local_eval: false
    max_new_tokens: 1024
  ai2d:
    question_file: "entropy_exp/datasets/_prepared_new_vqa/ai2d/llava_ai2d_test.jsonl"
    image_folder: "entropy_exp/datasets/_prepared_new_vqa/ai2d/images"
    supports_local_eval: true
    max_new_tokens: 32
