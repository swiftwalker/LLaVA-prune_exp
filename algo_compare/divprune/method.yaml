name: DivPrune
paper:
  title: "DivPrune: Diversity-based Visual Token Pruning for Large Multimodal Models"
  venue: "CVPR 2025"
  notes: "Official comparison target for DivPrune."
official:
  repo_url: "https://github.com/vbdi/divprune.git"
  repo_web: "https://github.com/vbdi/divprune"
  target_ref: "main"
  target_commit: "799e2d950aa01ba7860907f5a6d86061f885dca6"
  local_checkout: "algo_compare/divprune/third_party/divprune"
entrypoints:
  inference_script: "algo_compare/divprune/scripts/divprune_vqa_runner.py"
variants:
  - name: "divprune_r0p098"
    notes: "Official default retained ratio SUBSET_RATIO=0.098 at LAYER_INDEX=0 for LLaVA-1.5."
  - name: "divprune_next_dynamic"
    notes: "Official max-min selector on the dynamically inferred LLaVA-NeXT merged visual span."
defaults:
  model_name: "llava-v1.6-vicuna-7b"
  variant: "divprune_next_dynamic"
  conv_mode: "vicuna_v1"
  temperature: 0
  top_p: null
  num_beams: 1
  max_new_tokens: 128
  divprune:
    baseline: "OURS"
    layer_index: 0
    subset_ratio: 0.098
    visual_token_count: 576
local_comparison_notes:
  - "DivPrune official code is fetched into third_party and is not vendored."
  - "The wrapper imports the official LLaVA checkout and enables DivPrune through BASELINE/LAYER_INDEX/SUBSET_RATIO."
  - "For LLaVA-NeXT, the wrapper bypasses the upstream SYS_TOKEN_LEN=35 block and invokes the unchanged official selector on the actual merged visual span."
  - "LLaVA-NeXT retained counts are dynamic per sample; visual_token_count=576 remains metadata-only."
  - "Local metrics are produced by entropy_exp/src/eval_datasets.py for comparison consistency."
