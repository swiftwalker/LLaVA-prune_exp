  - pruning.sparsevlm_boost_hybrid.layer_modes=["S","S","S"]
  - output.run_tag_suffix=13b_l2-8-19_target118_baseline_sv2
- name: l2_8_19_gqa_target118_hybrid_mid_bw0p05
