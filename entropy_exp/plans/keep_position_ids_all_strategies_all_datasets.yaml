version: 1
label: "keep-position-ids-all-strategies-all-datasets"
pool_size: 6

gpu:
  min_free_gib: 16
  selection: "max_free"
  sample_seconds: 3
  poll_interval_seconds: 15

retry:
  budget_ratio: 0.1
  rounding: "ceil"

tmux:
  session_name: "sched_keep_position_ids"
  log_dir: "entropy_exp/outputs/logs/tmux"

environment:
  conda_sh: "~/miniconda3/etc/profile.d/conda.sh"
  conda_env: "llava"

defaults:
  max_samples: null
  extra_sets: &default_sets
    - "inference.seed=42"
    - "pruning.layer_selection=fixed"

experiments:
  - name: "gqa_l1_r0.2"
    dataset: "gqa"
    strategies: &all_strategies
      - "attn_score"
      - "pre_attn_score"
      - "masking_attn_score"
      - "entropy"
      - "random"
      - "sparsevlm"
    extra_sets:
      - "inference.seed=42"
      - "pruning.layer_selection=fixed"
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"
  - name: "gqa_l1_r0.3"
    dataset: "gqa"
