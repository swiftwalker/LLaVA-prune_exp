version: 1
label: "llava13b-smoke"
pool_size: 2

gpu:
  min_free_gib: 36
  selection: "max_free"
  sample_seconds: 3
  poll_interval_seconds: 15

retry:
  budget_ratio: 0.1
  rounding: "ceil"

tmux:
  session_name: "sched_llava13b_smoke"
  log_dir: "entropy_exp/outputs/logs/tmux"

environment:
  conda_sh: "/home/liuyu/miniconda3/etc/profile.d/conda.sh"
  conda_env: "llava"
  extra_env:
    - "HF_HUB_OFFLINE=1"
    - "TRANSFORMERS_OFFLINE=1"

defaults:
  max_samples: 4
  extra_sets:
    - "model.path=entropy_exp/models/llava-v1.5-13b"
    - "model.name=llava-v1.5-13b"
    - "model.attn_implementation=eager"
    - "inference.seed=42"
    - "pruning.layer_selection=fixed"
    - "pruning.prune_layers=[2,6,15]"
    - "pruning.prune_ratio=[0.479,0.333,0.410]"
    - "pruning.v_token_num=576"
    - "capture.save_attention=false"
    - "capture.save_importance_scores=true"
    - "capture.save_keep_indices=true"
    - "output.base_dir=entropy_exp/outputs/llava13b_smoke"
    - "pruning.sparsevlm_boost_hybrid.boost_weight_min=0.0"
    - "pruning.sparsevlm_boost_hybrid.boost_weight_max=0.15"
    - "pruning.sparsevlm_boost_hybrid.grid_size=6"
    - "pruning.sparsevlm_boost_hybrid.patch_per_row=24"
    - "pruning.sparsevlm_boost_hybrid.use_score_memory=false"
    - "pruning.sparsevlm_boost_hybrid.fallback_topk=4"
    - "pruning.sparsevlm_boost_hybrid.exclude_special_tokens=true"
    - "pruning.sparsevlm_boost_hybrid.min_visual_tokens_after_prune=16"

experiments:
  - {name: "gqa_baseline", dataset: "gqa", strategies: ["baseline"], extra_sets: ["output.run_tag_suffix=13b_smoke_baseline"]}
  - {name: "gqa_sparsevlm", dataset: "gqa", strategies: ["sparsevlm"], extra_sets: ["output.run_tag_suffix=13b_smoke_sparsevlm"]}
  - {name: "gqa_hybrid_mid", dataset: "gqa", strategies: ["sparsevlm_boost_hybrid"], extra_sets: ["pruning.sparsevlm_boost_hybrid.layer_modes=[\"O\",\"S\",\"S\"]", "output.run_tag_suffix=13b_smoke_hybrid_mid"]}
  - {name: "textvqa_baseline", dataset: "textvqa", strategies: ["baseline"], extra_sets: ["output.run_tag_suffix=13b_smoke_baseline"]}
  - {name: "textvqa_sparsevlm", dataset: "textvqa", strategies: ["sparsevlm"], extra_sets: ["output.run_tag_suffix=13b_smoke_sparsevlm"]}
  - {name: "textvqa_hybrid_mid", dataset: "textvqa", strategies: ["sparsevlm_boost_hybrid"], extra_sets: ["pruning.sparsevlm_boost_hybrid.layer_modes=[\"O\",\"S\",\"S\"]", "output.run_tag_suffix=13b_smoke_hybrid_mid"]}
  - {name: "pope_baseline", dataset: "pope", strategies: ["baseline"], extra_sets: ["output.run_tag_suffix=13b_smoke_baseline"]}
  - {name: "pope_sparsevlm", dataset: "pope", strategies: ["sparsevlm"], extra_sets: ["output.run_tag_suffix=13b_smoke_sparsevlm"]}
  - {name: "pope_hybrid_mid", dataset: "pope", strategies: ["sparsevlm_boost_hybrid"], extra_sets: ["pruning.sparsevlm_boost_hybrid.layer_modes=[\"O\",\"S\",\"S\"]", "output.run_tag_suffix=13b_smoke_hybrid_mid"]}
