    dataset: "gqa"
    strategies: &gqa_rnd
      - "random"
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"

  - name: "gqa_rnd_l1_r0p3"
    dataset: "gqa"
    strategies: *gqa_rnd
    extra_sets:
