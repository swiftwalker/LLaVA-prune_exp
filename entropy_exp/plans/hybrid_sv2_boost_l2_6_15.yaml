version: 1
label: "hybrid-sv2-boost-l2-6-15"
pool_size: 12

gpu:
  min_free_gib: 16
  selection: "max_free"
  sample_seconds: 3
  poll_interval_seconds: 15

retry:
  budget_ratio: 0.1
  rounding: "ceil"

tmux:
  session_name: "sched_hybrid_sv2_boost_l2_6_15"
  log_dir: "entropy_exp/outputs/logs/tmux"

environment:
  conda_sh: "/home/liuyu/miniconda3/etc/profile.d/conda.sh"
  conda_env: "llava"
  extra_env:
    - "HF_HUB_OFFLINE=1"
    - "TRANSFORMERS_OFFLINE=1"

defaults:
  max_samples: null
  extra_sets:
    - "inference.seed=42"
    - "pruning.layer_selection=fixed"
    - "pruning.prune_layers=[2,6,15]"
    - "capture.save_attention=false"
    - "capture.save_importance_scores=true"
    - "capture.save_keep_indices=true"
    - "output.base_dir=entropy_exp/outputs/hybrid_sv2_boost_l2_6_15"
    - "pruning.sparsevlm_boost_hybrid.boost_weight_min=0.0"
    - "pruning.sparsevlm_boost_hybrid.boost_weight_max=0.15"
    - "pruning.sparsevlm_boost_hybrid.grid_size=6"
    - "pruning.sparsevlm_boost_hybrid.patch_per_row=24"
    - "pruning.sparsevlm_boost_hybrid.use_score_memory=false"
    - "pruning.sparsevlm_boost_hybrid.fallback_topk=4"
    - "pruning.sparsevlm_boost_hybrid.exclude_special_tokens=true"
    - "pruning.sparsevlm_boost_hybrid.min_visual_tokens_after_prune=16"

experiments:
  - {name: "gqa_target118_baseline_sv2", dataset: "gqa", strategies: ["sparsevlm_boost_hybrid"], extra_sets: ["pruning.prune_ratio=[0.479,0.333,0.410]", "pruning.sparsevlm_boost_hybrid.layer_modes=[\"S\",\"S\",\"S\"]", "output.run_tag_suffix=target118_baseline_sv2"]}
