version: 1
label: "keep-position-ids-sparsevlm-adaptive-stratified-full-matrix"
pool_size: 12

gpu:
  min_free_gib: 16
  selection: "max_free"
  sample_seconds: 3
  poll_interval_seconds: 15

retry:
  budget_ratio: 0.1
  rounding: "ceil"

tmux:
  session_name: "sched_keep_position_ids_adaptive"
  log_dir: "entropy_exp/outputs/logs/tmux"

environment:
  conda_sh: "/data/liuyu/anaconda3/etc/profile.d/conda.sh"
  conda_env: "llava"

defaults:
  max_samples: null
  extra_sets:
    - "inference.seed=42"
    - "pruning.layer_selection=fixed"
    - "pruning.sparsevlm_adaptive_stratified.fallback_topk=4"
    - "pruning.sparsevlm_adaptive_stratified.exclude_special_tokens=true"
    - "pruning.sparsevlm_adaptive_stratified.min_visual_tokens_after_prune=16"
    - "pruning.sparsevlm_adaptive_stratified.high_ratio=0.7"
    - "pruning.sparsevlm_adaptive_stratified.grid_size=6"
    - "pruning.sparsevlm_adaptive_stratified.patch_per_row=24"
    - "pruning.sparsevlm_adaptive_stratified.intra_stratum_mode=random"

experiments:
  - name: "gqa_l1_r0.2"
    dataset: "gqa"
    strategies: &adaptive_strategy
      - "sparsevlm_adaptive_stratified"
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.2]"
  - name: "gqa_l1_r0.3"
    dataset: "gqa"
    strategies: *adaptive_strategy
    extra_sets:
      - "pruning.prune_layers=[1]"
      - "pruning.prune_ratio=[0.3]"
