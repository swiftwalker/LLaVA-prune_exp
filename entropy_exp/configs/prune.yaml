# Pruning Experiment Configuration
# ==================================
# Two strategies are compared under the same pruning layer & evaluation:
#   A) attn_score  — SparseVLM-style attention importance
#   B) pre_attn_score — same aggregation, but prune before the target layer forward
#   C) masking_attn_score — same aggregation, but mask dropped vision tokens only inside the target layer
#   D) tail_masking_attn_score — same masking behavior, but apply it on every layer from a configured start layer onward
#   E) entropy     — entropy-weighted head aggregation
#   F) random      — uniform random token importance (seed-reproducible)
#   G) sparsevlm   — text-rater-guided text->vision attention pruning
#   H) sparsevlm_adaptive_stratified — SparseVLM scoring + adaptive stratified compensation
#   I) sparsevlm_entropy_alpha — SparseVLM scoring + entropy-adaptive stratified compensation
#   J) sparsevlm_entropy_alpha_global — entropy-alpha with online cross-layer global memory
#   K) sparsevlm_boost — SparseVLM scoring + entropy-adaptive deterministic score boosting
#   L) sparsevlm_boost_hybrid — layer-wise SparseVLM/boost switching
#   M) sparsevlm_diverse_mmr — text-saliency candidate pool + diversity MMR selection
#   N) sparsevlm_adaptive_diverse_mmr — pruning-ratio-adaptive saliency/diversity selection
#   O) sparsevlm_scnd — saliency-constrained native DivPrune + boundary refinement
#   P) sparsevlm_fast_scnd — low-cost SCND with micro-greedy diversity and cached tie-break
#   Q) sparsevlm_compensated — SparseVLM scoring + entropy-adaptive fixed-seed compensated sampling
#   R) sparsevlm_budget_candidate_scnd — target-aware Candidate-SCND ablation

model:
  path: "entropy_exp/models/llava-v1.5-7b"
  name: "llava-v1.5-7b"
  attn_implementation: "eager"      # eager required for output_attentions
  disable_mmap: true                # set false for safetensors-only checkpoints such as LLaVA-NeXT

inference:
  temperature: 0
  top_p: null
  num_beams: 1
  max_new_tokens: 128
  conv_mode: "vicuna_v1"
  seed: 42

pruning:
  strategy: "attn_score"            # attn_score | pre_attn_score | masking_attn_score | tail_masking_attn_score | entropy | random | sparsevlm | sparsevlm_adaptive_stratified | sparsevlm_entropy_alpha | sparsevlm_entropy_alpha_global | sparsevlm_boost | sparsevlm_boost_hybrid | sparsevlm_compensated | sparsevlm_diverse_mmr | sparsevlm_adaptive_diverse_mmr | sparsevlm_scnd | sparsevlm_fast_scnd | sparsevlm_budget_candidate_scnd
  # --- layer & ratio (paired lists of equal length) ---
  layer_selection: "fixed"          # fixed | dynamic (placeholder)
  prune_layers: [2, 3]             # 剪枝层列表 (0-indexed)
  prune_ratio: [0.5, 0.5]          # 对应每层的剪枝比例（标量则广播到所有层）
  v_token_num: 576                  # positive int for fixed layouts; "auto" for LLaVA-NeXT anyres
  max_samples: null                 # null = all; int for debugging
  # --- strategy-specific ---
  attn_score: {}
  pre_attn_score: {}
  masking_attn_score: {}
  tail_masking_attn_score: {}
  entropy:
    dynamic_ratio: false            # if true, ratio is modulated by entropy
    dynamic_scale: 0.5
    max_prune_ratio: 0.9
  random: {}
  sparsevlm:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
  sparsevlm_adaptive_stratified:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    high_ratio: 0.7
    grid_size: 6
    patch_per_row: 24
    intra_stratum_mode: "random"
  sparsevlm_entropy_alpha:
    alpha_min: 0.4
    alpha_max: 0.95
    mapping_type: "linear"          # linear | sigmoid | piecewise
    sigmoid_k: 10.0
    sigmoid_mu: 0.5
    piecewise_threshold: 0.5
    piecewise_slope_low: 0.3
    piecewise_slope_high: 1.7
    grid_size: 6
    patch_per_row: 24
    intra_stratum_mode: "random"
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
  sparsevlm_entropy_alpha_global:
    alpha_min: 0.5
    alpha_max: 1.0
    mapping_type: "linear"
    sigmoid_k: 10.0
    sigmoid_mu: 0.5
    piecewise_threshold: 0.5
    piecewise_slope_low: 0.3
    piecewise_slope_high: 1.7
    grid_size: 6
    patch_per_row: 24
    intra_stratum_mode: "random"
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    global_current_weight: 0.5
    global_ema_decay: 0.6
    global_debt_weight: 0.5
    global_first_layer_fallback: true
  sparsevlm_boost:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    boost_weight_min: 0.0
    boost_weight_max: 0.15
    grid_size: 6
    patch_per_row: 24
    use_score_memory: true
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_boost_hybrid:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    layer_modes: ["O", "O"]
    boost_weight_min: 0.0
    boost_weight_max: 0.15
    grid_size: 6
    patch_per_row: 24
    use_score_memory: false
  sparsevlm_compensated:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    beta_min: 0.3
    beta_max: 1.0
    seed: 42
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_diverse_mmr:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    layer_modes: ["D", "D"]
    grid_size: 6
    patch_per_row: 24
    grid_balance_weight: 0.25
    diversity_weight_max: 0.20
    core_keep_ratio: 0.50
    candidate_pool_multiplier: 2.0
    diversity_decay_per_step: 0.5
    distance_metric: "cosine"
    use_score_memory: false
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_adaptive_diverse_mmr:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    layer_modes: ["A", "S"]
    grid_size: 6
    patch_per_row: 24
    grid_balance_weight: 0.25
    min_candidate_multiplier: 1.2
    max_candidate_multiplier: 2.5
    distance_metric: "cosine"
    use_score_memory: false
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_scnd:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    layer_modes: ["C", "B"]
    seed_ratio_min: 0.15
    seed_ratio_max: 0.55
    seed_pool_multiplier: 2.0
    saliency_floor_min: 0.65
    saliency_floor_max: 0.90
    boundary_ratio: 0.25
    saliency_repair: true
    distance_metric: "cosine"      # cosine | euclidean | dot
    selection_backend: "auto"
    c_selection_rule: "native"
    seed: 42
    entropy_calibration:
      mode: "identity"               # identity | quantile_affine
      artifact_path: null
    use_score_memory: false
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_fast_scnd:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    # null means auto by prune layer count: [F], [F,T], or [F,T,S...].
    layer_modes: null
    core_ratio_min: 0.10
    core_ratio_max: 0.35
    saliency_pool_multiplier: 1.5
    reservoir_multiplier: 0.5
    reservoir_rank_multiplier: 4.0
    candidate_cap_multiplier: 2.0
    projection_dim: 64
    greedy_steps: 16
    tie_break_band_ratio: 0.10
    tie_break_band_max: 32
    cached_diversity_weight: 0.05
    distance_metric: "cosine"
    use_score_memory: false
    global_current_weight: 0.5
    global_ema_decay: 0.6
  sparsevlm_budget_candidate_scnd:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    # budget_target=auto recognizes the three SV1-aligned retain targets.
    budget_target: "auto"
    layer_policy: "auto"
    layer_modes: null
    seed_ratio_min: 0.15
    seed_ratio_max: 0.55
    seed_pool_multiplier: 2.0
    # null means use target-aware Candidate-SCND v3 profile defaults.
    saliency_floor_min: null
    saliency_floor_max: null
    boundary_ratio: null
    boundary_pool_multiplier: null
    cached_diversity_weight: null
    boundary_gate_min: null
    saliency_repair: true
    distance_metric: "cosine"
    use_score_memory: false
    global_current_weight: 0.5
    global_ema_decay: 0.6

capture:
  save_attention: false             # save text→vision attention sub-matrices to captures.h5 (HDF5)
  capture_layers: "all"            # "all" or list of layer indices, e.g. [0, 1, 2, 3]
  save_importance_scores: true      # save per-token importance scores in stats.jsonl
  save_keep_indices: true           # save kept token indices in stats.jsonl
  # HDF5 capture parameters (same as Phase 1)
  precision: "fp16"                 # fp16 | fp32
  compression: "gzip"
  compression_opts: 4

diagnostics:
  rep_bottleneck:
    enabled: false                  # opt-in export for SCND representation bottleneck figures
    question_ids: []                # explicit sample ids only; avoids accidental full hidden dumps
    sample_indices: []              # optional original dataset row indices for duplicate question_id cases
    capture_layer: 2                # first pruning layer for C-layer diagnostics
    output_name: "rep_bottleneck_hidden.h5"
    precision: "fp16"               # fp16 | fp32
    compression: "gzip"
    compression_opts: 4

datasets:
  gqa:
    question_file: "entropy_exp/eval_questions/gqa/llava_gqa_testdev_balanced.jsonl"
    image_folder: "entropy_exp/datasets/gqa/images"
  mme:
    question_file: "entropy_exp/eval_questions/MME/llava_mme.jsonl"
    image_folder: "entropy_exp/datasets/MME_Benchmark_release_version"
  pope:
    question_file: "entropy_exp/eval_questions/pope/llava_pope_test.jsonl"
    image_folder: "entropy_exp/datasets/pope/val2014"
  textvqa:
    question_file: "entropy_exp/eval_questions/textvqa/llava_textvqa_val_v051_ocr.jsonl"
    image_folder: "entropy_exp/datasets/textvqa/train_images"
  scienceqa:
    question_file: "entropy_exp/eval_questions/scienceqa/llava_test_CQM-A.json"
    image_folder: "entropy_exp/eval_questions/scienceqa/test"
  mmbench:
    question_file: "entropy_exp/eval_questions/mmbench/mmbench_dev_20230712.tsv"
    image_folder: null
    max_new_tokens: 32
  mmvet:
    question_file: "entropy_exp/datasets/_prepared_new_vqa/mmvet/llava_mmvet_test.jsonl"
    image_folder: "entropy_exp/datasets/_prepared_new_vqa/mmvet/images"
    max_new_tokens: 1024
  ai2d:
    question_file: "entropy_exp/datasets/_prepared_new_vqa/ai2d/llava_ai2d_test.jsonl"
    image_folder: "entropy_exp/datasets/_prepared_new_vqa/ai2d/images"
    max_new_tokens: 32

output:
  base_dir: "entropy_exp/outputs"
