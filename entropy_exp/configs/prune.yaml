# Pruning Experiment Configuration
# ==================================
# Two strategies are compared under the same pruning layer & evaluation:
#   A) attn_score  — SparseVLM-style attention importance
#   B) pre_attn_score — same aggregation, but prune before the target layer forward
#   C) masking_attn_score — same aggregation, but mask dropped vision tokens only inside the target layer
#   D) tail_masking_attn_score — same masking behavior, but apply it on every layer from a configured start layer onward
#   E) entropy     — entropy-weighted head aggregation
#   F) random      — uniform random token importance (seed-reproducible)
#   G) sparsevlm   — text-rater-guided text->vision attention pruning
#   H) sparsevlm_adaptive_stratified — SparseVLM scoring + adaptive stratified compensation
#   I) sparsevlm_entropy_alpha — SparseVLM scoring + entropy-adaptive stratified compensation

model:
  path: "entropy_exp/models/llava-v1.5-7b"
  name: "llava-v1.5-7b"
  attn_implementation: "eager"      # eager required for output_attentions

inference:
  temperature: 0
  top_p: null
  num_beams: 1
  max_new_tokens: 128
  conv_mode: "vicuna_v1"
  seed: 42

pruning:
  strategy: "attn_score"            # attn_score | pre_attn_score | masking_attn_score | tail_masking_attn_score | entropy | random | sparsevlm | sparsevlm_adaptive_stratified | sparsevlm_entropy_alpha
  # --- layer & ratio (paired lists of equal length) ---
  layer_selection: "fixed"          # fixed | dynamic (placeholder)
  prune_layers: [2, 3]             # 剪枝层列表 (0-indexed)
  prune_ratio: [0.5, 0.5]          # 对应每层的剪枝比例（标量则广播到所有层）
  v_token_num: 576                  # LLaVA-1.5: 24×24 patches
  max_samples: null                 # null = all; int for debugging
  # --- strategy-specific ---
  attn_score: {}
  pre_attn_score: {}
  masking_attn_score: {}
  tail_masking_attn_score: {}
  entropy:
    dynamic_ratio: false            # if true, ratio is modulated by entropy
    dynamic_scale: 0.5
    max_prune_ratio: 0.9
  random: {}
  sparsevlm:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
  sparsevlm_adaptive_stratified:
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16
    high_ratio: 0.7
    grid_size: 6
    patch_per_row: 24
    intra_stratum_mode: "random"
  sparsevlm_entropy_alpha:
    alpha_min: 0.4
    alpha_max: 0.95
    mapping_type: "linear"          # linear | sigmoid | piecewise
    sigmoid_k: 10.0
    sigmoid_mu: 0.5
    piecewise_threshold: 0.5
    piecewise_slope_low: 0.3
    piecewise_slope_high: 1.7
    grid_size: 6
    patch_per_row: 24
    intra_stratum_mode: "random"
    fallback_topk: 4
    exclude_special_tokens: true
    min_visual_tokens_after_prune: 16

capture:
  save_attention: false             # save text→vision attention sub-matrices to captures.h5 (HDF5)
  capture_layers: "all"            # "all" or list of layer indices, e.g. [0, 1, 2, 3]
  save_importance_scores: true      # save per-token importance scores in stats.jsonl
  save_keep_indices: true           # save kept token indices in stats.jsonl
  # HDF5 capture parameters (same as Phase 1)
  precision: "fp16"                 # fp16 | fp32
  compression: "gzip"
  compression_opts: 4

datasets:
  gqa:
    question_file: "entropy_exp/eval_questions/gqa/llava_gqa_testdev_balanced.jsonl"
    image_folder: "entropy_exp/datasets/gqa/images"
  mme:
    question_file: "entropy_exp/eval_questions/MME/llava_mme.jsonl"
    image_folder: "entropy_exp/datasets/MME_Benchmark_release_version"
  pope:
    question_file: "entropy_exp/eval_questions/pope/llava_pope_test.jsonl"
    image_folder: "entropy_exp/datasets/pope/val2014"
  textvqa:
    question_file: "entropy_exp/eval_questions/textvqa/llava_textvqa_val_v051_ocr.jsonl"
    image_folder: "entropy_exp/datasets/textvqa/train_images"
  scienceqa:
    question_file: "entropy_exp/eval_questions/scienceqa/llava_test_CQM-A.json"
    image_folder: "entropy_exp/eval_questions/scienceqa/test"
  mmbench:
    question_file: "entropy_exp/eval_questions/mmbench/mmbench_dev_20230712.tsv"
    image_folder: null

output:
  base_dir: "entropy_exp/outputs"
